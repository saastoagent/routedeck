[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routedeck-core"
version = "0.1.0"
description = "Feature-composed interaction state, supervised operations, and public projections for agentic applications."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3", "jsonschema==4.26.0"]
readme = "README.md"
license = "MIT"
keywords = ["agentic-ui", "state-management", "langgraph", "react", "runtime-contracts"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
langgraph = ["langgraph==1.2.9", "langchain==1.3.13", "langchain-openai==1.3.5"]
fastapi = ["fastapi==0.136.3", "httpx==0.28.1", "uvicorn==0.48.0"]
sqlite = ["cryptography>=43,<47"]
testing = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "pytest-cov>=6,<8"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = [
    "routedeck_core",
    "routedeck_langgraph",
    "routedeck_fastapi",
    "routedeck_sqlite",
    "routedeck_testing",
]
license-files = ["LICENSE"]
