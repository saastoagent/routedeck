[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routedeck-core"
version = "0.1.0"
description = "Feature-composed interaction state, supervised operations, and public projections for agentic applications."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3", "jsonschema==4.26.0"]
readme = "README.md"
license = "MIT"
authors = [{ name = "RouteDeck contributors" }]
keywords = ["agentic-ui", "state-management", "langgraph", "react", "runtime-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/saastoagent/routedeck"
Documentation = "https://github.com/saastoagent/routedeck/tree/main/docs"
Issues = "https://github.com/saastoagent/routedeck/issues"
Repository = "https://github.com/saastoagent/routedeck.git"

[project.optional-dependencies]
langgraph = ["langgraph==1.2.9", "langchain==1.3.13", "langchain-openai==1.3.5"]
fastapi = ["fastapi==0.136.3", "httpx==0.28.1", "uvicorn==0.48.0"]
persistence = [
    "cryptography>=43,<47",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]
testing = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "pytest-cov>=6,<8"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "types-jsonschema==4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = [
    "routedeck_core",
    "routedeck_langgraph",
    "routedeck_fastapi",
    "routedeck_sqlalchemy",
    "routedeck_testing",
]
license-files = ["LICENSE"]
