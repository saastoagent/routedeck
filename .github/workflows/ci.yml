name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Python workspace
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fastapi,langgraph,persistence,testing,dev]"
          python -m pip install -e ".\examples\medusa-agent\backend"
      - name: Test framework and non-live consumer paths
        shell: pwsh
        run: >-
          python -m pytest tests examples/medusa-agent/backend/tests
          --ignore=examples/medusa-agent/backend/tests/integration/real_medusa -q
      - name: Check Python style and types
        shell: pwsh
        run: |
          python -m ruff check routedeck_core routedeck_fastapi routedeck_langgraph routedeck_sqlalchemy routedeck_testing tests
          python -m mypy --explicit-package-bases routedeck_core routedeck_fastapi routedeck_langgraph routedeck_sqlalchemy routedeck_testing
      - name: Check architecture and documentation contracts
        shell: pwsh
        run: |
          python scripts/check_boundaries.py --json "$env:RUNNER_TEMP\boundary-report.json"
          python scripts/check_doc_coverage.py
          python scripts/check_context_architecture.py
      - name: Build and inspect Python distribution
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "python-dist"
          python -m build --outdir $output
          $wheels = @(Get-ChildItem -LiteralPath $output -Filter *.whl)
          if ($wheels.Count -ne 1) { throw "Expected exactly one wheel, found $($wheels.Count)" }
          python scripts/verify_release_archives.py --python-wheel $wheels[0].FullName

  typescript:
    name: TypeScript
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
      - name: Set up Python for archive verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Test, typecheck, and build
        shell: pwsh
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Pack and inspect public npm packages
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "npm-dist"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          pnpm --dir packages/core pack --pack-destination $output
          pnpm --dir packages/react pack --pack-destination $output
          $archives = @(Get-ChildItem -LiteralPath $output -Filter *.tgz)
          if ($archives.Count -ne 2) { throw "Expected two npm archives, found $($archives.Count)" }
          python scripts/verify_release_archives.py --npm $archives[0].FullName --npm $archives[1].FullName
          $core = @($archives | Where-Object Name -Like "*core*.tgz")[0]
          $react = @($archives | Where-Object Name -Like "*react*.tgz")[0]
          $consumer = Join-Path $env:RUNNER_TEMP "npm-consumer"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          $coreSpec = "file:$($core.FullName.Replace('\', '/'))"
          $manifest = [ordered]@{
            name = "routedeck-ci-consumer"
            private = $true
            type = "module"
            dependencies = [ordered]@{
              "@routedeck/core" = $coreSpec
              "@routedeck/react" = "file:$($react.FullName.Replace('\', '/'))"
              "@xyflow/react" = "12.11.2"
              react = "19.2.7"
              "react-dom" = "19.2.7"
            }
            devDependencies = [ordered]@{ typescript = "7.0.2" }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$consumer\package.json" -Encoding utf8
          @("packages:", "  - .", "overrides:", "  '@routedeck/core': '$coreSpec'") |
            Set-Content -LiteralPath "$consumer\pnpm-workspace.yaml" -Encoding utf8
          @(
            "import { createRouteDeckAgentClient } from '@routedeck/core';",
            "import { RouteDeckProvider } from '@routedeck/react';",
            "void createRouteDeckAgentClient;",
            "void RouteDeckProvider;"
          ) | Set-Content -LiteralPath "$consumer\index.ts" -Encoding utf8
          $tsconfig = [ordered]@{
            compilerOptions = [ordered]@{
              target = "ES2022"
              module = "ESNext"
              moduleResolution = "Bundler"
              jsx = "react-jsx"
              strict = $true
              skipLibCheck = $true
            }
            files = @("index.ts")
          }
          $tsconfig | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$consumer\tsconfig.json" -Encoding utf8
          pnpm --dir $consumer install --frozen-lockfile=false
          pnpm --dir $consumer exec tsc -p tsconfig.json --noEmit
